name: Update Top 10 charts

on:
  schedule:
    # GitHub cron 为 UTC 且是"尽力而为"(可能延迟/跳过),故一天设 3 个冗余时间点:
    # 北京时间约 00:37 / 06:41 / 12:23,脚本无变化时不提交,多跑无副作用
    - cron: '37 16 * * *'
    - cron: '41 22 * * *'
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate charts
        run: node scripts/generate-top10.mjs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stars-top10.svg assets/stars-top10-dark.svg assets/commits-top10.svg assets/commits-top10-dark.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh Star/Commit Top 10 charts"
            git push
          fi
